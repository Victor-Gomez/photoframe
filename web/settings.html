<!doctype html>
<html lang="{{ lang }}">

<head>
  {% include "admin-head.html" %}
</head>

<body>
  <main>
    {% include "admin-header.html" %}

    <h2>{{ t('h.global') }}</h2>
    <p class="note">{{ t('global.note') }}</p>
    {% if not db.open %}<p class="note bad">{{ t('db.busy') }}</p>{% endif %}
    <fieldset>
      <div class="field">
        <label for="slideSeconds">{{ t('row.slideSeconds') }}</label>
        <div class="controls">
          <input type="number" id="slideSeconds" min="3" max="3600" value="{{ settings.slideSeconds }}">
        </div>
      </div>

      <div class="field">
        <label>{{ t('row.quiet') }}
          <small>{{ t('hint.quiet') }}</small></label>
        <div class="controls">
          <label class="switch">
            <input type="checkbox" id="quietOn" {{ "checked" if settings.quietFrom and settings.quietTo }}>
            {{ t('quiet.from') }}
          </label>
          <input type="time" id="quietFrom" value="{{ settings.quietFrom or '23:00' }}">
          <span>{{ t('quiet.to') }}</span>
          <input type="time" id="quietTo" value="{{ settings.quietTo or '07:00' }}">
        </div>
      </div>

      <div class="field">
        <label for="language">{{ t('row.language') }}</label>
        <div class="controls">
          <select id="language">
            {% for code, name in languages.items() %}
            <option value="{{ code }}" {{ "selected" if settings.language == code }}>{{ name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="field">
        <label for="logLevel">{{ t('row.logLevel') }}
          <small>{{ t('hint.logLevel') }}</small></label>
        <div class="controls">
          <select id="logLevel">
            {% for level in logLevels %}
            <option value="{{ level }}" {{ "selected" if settings.logLevel == level }}>{{ t('log.' + level) }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
    </fieldset>

    <h2>{{ t('h.device') }}</h2>
    <p class="note">{{ t('device.note') }}</p>
    <fieldset>
      <div class="field">
        <label for="weightByRating">{{ t('row.weightByRating') }}
          <small>{{ t('hint.weightByRating') }}</small></label>
        <div class="controls">
          <label class="switch">
            <input type="checkbox" id="weightByRating" {{ "checked" if settings.weightByRating }}>
          </label>
        </div>
      </div>

      <div class="field">
        <label for="showRating">{{ t('row.showRating') }}
          <small>{{ t('hint.showRating') }}</small></label>
        <div class="controls">
          <label class="switch">
            <input type="checkbox" id="showRating" {{ "checked" if settings.showRating }}>
          </label>
        </div>
      </div>

      <div class="field">
        <label for="ratingFilter">{{ t('row.ratingFilter') }}</label>
        <div class="controls">
          <select id="ratingFilter">
            {% for opt in ratingFilters %}
            <option value="{{ opt }}" {{ "selected" if settings.ratingFilter == opt }}>{{ t('ratingFilter.' + opt) }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="field">
        <label for="ratingThreshold">{{ t('row.ratingThreshold') }}
          <small>{{ t('hint.ratingThreshold') }}</small></label>
        <div class="controls">
          <label class="switch">
            <input type="checkbox" id="ratingThresholdEnabled" {{ "checked" if settings.ratingThresholdEnabled }}>
          </label>
          <input type="number" id="ratingThreshold" min="0" max="10" value="{{ settings.ratingThreshold }}">
        </div>
      </div>

      <div class="field">
        <label for="folderFilter">{{ t('row.folderFilter') }}
          <small>{{ t('hint.folderFilter') }}</small></label>
        <div class="controls">
          <select id="folderFilter">
            <option value="" {{ "selected" if not settings.folderFilter }}>{{ t('folderFilter.all') }}</option>
            {% if settings.folderFilter and settings.folderFilter not in folders %}
            <option value="{{ settings.folderFilter }}" selected>{{ settings.folderFilter }}</option>
            {% endif %}
            {% for folder in folders %}
            <option value="{{ folder }}" {{ "selected" if settings.folderFilter == folder }}>{{ folder }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="field">
        <label for="imageFit">{{ t('row.imageFit') }}</label>
        <div class="controls">
          <select id="imageFit">
            {% for opt in imageFits %}
            <option value="{{ opt }}" {{ "selected" if settings.imageFit == opt }}>{{ t('imageFit.' + opt) }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="field">
        <label id="orientationFilterLabel">{{ t('row.orientationFilter') }}</label>
        <div class="controls">
          <div class="segmented" id="orientationFilter" role="radiogroup" aria-labelledby="orientationFilterLabel">
            <button type="button" role="radio" data-value="any" aria-checked="{{ 'true' if settings.orientationFilter == 'any' else 'false' }}">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
              <span>{{ t('orientationFilter.any') }}</span>
            </button>
            <button type="button" role="radio" data-value="device" aria-checked="{{ 'true' if settings.orientationFilter == 'device' else 'false' }}">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
              <span>{{ t('orientationFilter.device') }}</span>
            </button>
            <button type="button" role="radio" data-value="landscape" aria-checked="{{ 'true' if settings.orientationFilter == 'landscape' else 'false' }}">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="12" x="2" y="6" rx="2"/></svg>
              <span>{{ t('orientationFilter.landscape') }}</span>
            </button>
            <button type="button" role="radio" data-value="portrait" aria-checked="{{ 'true' if settings.orientationFilter == 'portrait' else 'false' }}">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="12" height="20" x="6" y="2" rx="2"/></svg>
              <span>{{ t('orientationFilter.portrait') }}</span>
            </button>
          </div>
        </div>
      </div>
      <div class="field">
        <label for="imageMode">{{ t('row.images') }}
          <small id="deviceNote"></small></label>
        <div class="controls">
          <select id="imageMode">
            <option value="auto">{{ t('images.auto') }}</option>
            <option value="1">{{ t('images.originals') }}</option>
            <option value="0">{{ t('images.reencoded') }}</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="deviceLanguage">{{ t('row.deviceLanguage') }}</label>
        <div class="controls">
          <select id="deviceLanguage">
            <option value="">{{ t('language.asFrame') }}</option>
            {% for code, name in languages.items() %}
            <option value="{{ code }}" {{ "selected" if deviceLanguage == code }}>{{ name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
    </fieldset>
  </main>

  <div id="toast" hidden></div>

  <script>
    const TEXT = {{ js_text | tojson }};
    const $ = id => document.getElementById(id);

    // Every control saves itself the moment it changes, so there is nothing to forget to
    // press. The toast is the only acknowledgement, which is why a failure keeps it up
    // longer and puts the field back to what is actually stored.
    let toastTimer;
    function toast(message, bad) {
      const box = $('toast');
      box.textContent = message;
      box.className = bad ? 'bad' : 'good';
      box.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { box.hidden = true; }, bad ? 6000 : 2500);
    }

    /* -- generales ---------------------------------------------------------- */

    function paintQuiet() {
      $('quietFrom').disabled = $('quietTo').disabled = !$('quietOn').checked;
    }
    paintQuiet();

    function paintThreshold() {
      $('ratingThreshold').disabled = !$('ratingThresholdEnabled').checked || $('ratingFilter').value === 'unscored';
    }
    paintThreshold();

    async function save(patch) {
      try {
        const res = await fetch('/api/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(patch),
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body.error || res.status);
        // Echo what was stored rather than what was typed: the server clamps.
        $('slideSeconds').value = body.slideSeconds;
        $('weightByRating').checked = !!body.weightByRating;
        $('showRating').checked = !!body.showRating;
        $('ratingFilter').value = body.ratingFilter;
        $('ratingThresholdEnabled').checked = !!body.ratingThresholdEnabled;
        $('ratingThreshold').value = body.ratingThreshold;
        paintThreshold();
        $('folderFilter').value = body.folderFilter;
        $('imageFit').value = body.imageFit;
        paintOrientation(body.orientationFilter);
        // The page is rendered by the server, so its own language changes on reload — and
        // the page coming back in the new language is the acknowledgement.
        if ('language' in patch && body.language !== TEXT.language && !TEXT.deviceLanguage) {
          location.reload();
          return;
        }
        toast(TEXT.saved);
      } catch (err) {
        toast(String(err.message || err), true);
        location.reload();   // back to what is actually stored, whatever was typed
      }
    }

    function paintOrientation(val) {
      for (const btn of $('orientationFilter').querySelectorAll('button[data-value]')) {
        btn.setAttribute('aria-checked', btn.dataset.value === val ? 'true' : 'false');
      }
    }

    $('slideSeconds').addEventListener('change', () => save({ slideSeconds: +$('slideSeconds').value }));
    $('weightByRating').addEventListener('change', () => save({ weightByRating: $('weightByRating').checked }));
    $('showRating').addEventListener('change', () => save({ showRating: $('showRating').checked }));
    $('ratingFilter').addEventListener('change', () => { paintThreshold(); save({ ratingFilter: $('ratingFilter').value }); });
    $('ratingThresholdEnabled').addEventListener('change', () => { paintThreshold(); save({ ratingThresholdEnabled: $('ratingThresholdEnabled').checked }); });
    $('ratingThreshold').addEventListener('change', () => save({ ratingThreshold: +$('ratingThreshold').value }));
    $('folderFilter').addEventListener('change', () => save({ folderFilter: $('folderFilter').value }));
    $('imageFit').addEventListener('change', () => save({ imageFit: $('imageFit').value }));
    $('orientationFilter').addEventListener('click', e => {
      const btn = e.target.closest('button[data-value]');
      if (!btn) return;
      const val = btn.dataset.value;
      paintOrientation(val);
      save({ orientationFilter: val });
    });
    $('language').addEventListener('change', () => save({ language: $('language').value }));
    $('logLevel').addEventListener('change', () => save({ logLevel: $('logLevel').value }));

    // Both ends together: half a window is not a window, and the server says so.
    function saveQuiet() {
      const on = $('quietOn').checked;
      save({ quietFrom: on ? $('quietFrom').value : '', quietTo: on ? $('quietTo').value : '' });
    }
    $('quietOn').addEventListener('change', () => { paintQuiet(); saveQuiet(); });
    $('quietFrom').addEventListener('change', saveQuiet);
    $('quietTo').addEventListener('change', saveQuiet);

    /* -- este dispositivo --------------------------------------------------- */

    // The same guess frame.js makes, so the note says what "automatic" means here.
    const cores = navigator.hardwareConcurrency || 0;
    const memory = navigator.deviceMemory || 0;
    const choice = (cores >= 6 || memory >= 6) ? TEXT.originals : TEXT.reencoded;
    $('deviceNote').textContent = TEXT.guess
      .replace('{choice}', choice).replace('{cores}', cores || '?').replace('{memory}', memory || '?');

    let stored = null;
    try { stored = localStorage.getItem('frameFull'); } catch { /* storage disabled */ }
    $('imageMode').value = stored === null ? 'auto' : stored;

    $('imageMode').addEventListener('change', () => {
      const wanted = $('imageMode').value;
      try {
        if (wanted === 'auto') localStorage.removeItem('frameFull');
        else localStorage.setItem('frameFull', wanted);
        toast(TEXT.saved);
      } catch {
        toast(TEXT.noStorage, true);
      }
    });

    // A cookie, not localStorage: /status and this page are rendered by the server, and
    // only a cookie reaches it in time to render them in this device's language.
    $('deviceLanguage').addEventListener('change', () => {
      const wanted = $('deviceLanguage').value;
      document.cookie = wanted
        ? `frame_lang=${wanted}; path=/; max-age=31536000; samesite=lax`
        : 'frame_lang=; path=/; max-age=0; samesite=lax';
      location.reload();   // the page comes back in the language it now speaks
    });
  </script>
</body>

</html>
